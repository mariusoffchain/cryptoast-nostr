name: Cryptoast → Nostr

on:
  schedule:
    # Toutes les 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    # Permet de déclencher manuellement depuis l'interface GitHub

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # nécessaire pour committer posted.json

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Publication des nouveaux articles sur Nostr
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          DEBUG_TAGS: "true"
        run: python nostr_poster.py

      - name: Sauvegarde de posted.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "chore: update posted.json [skip ci]"
          git push
